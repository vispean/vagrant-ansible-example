---
# Admin-Zugang (SSH) und Dateiablage (Samba).
- name: SSH- und Samba-Pakete installieren
  ansible.builtin.apt:
    name:
      - openssh-server
      - samba
      - smbclient
    state: present

- name: Admin-Konto anlegen
  ansible.builtin.user:
    name: "{{ admin_user }}"
    password: "{{ admin_password | password_hash('sha512') }}"
    groups: sudo
    shell: /bin/bash
    state: present
  no_log: true

- name: SSH-Dienst aktivieren und starten
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Freigabeverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ samba_user }}"
    group: "{{ samba_user }}"
    mode: "0770"

- name: Samba-Konfiguration aus Vorlage erzeugen
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
  notify: Samba neu starten

- name: Samba-Benutzer setzen (Passwort aus secrets)
  ansible.builtin.shell:
    cmd: "(pdbedit -L | grep -qw {{ samba_user }}) || (printf '%s\\n%s\\n' '{{ samba_password }}' '{{ samba_password }}' | smbpasswd -s -a {{ samba_user }})"
  register: smbpw
  changed_when: "'Added user' in smbpw.stdout"
  no_log: true

- name: Samba-Dienst aktivieren und starten
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true
