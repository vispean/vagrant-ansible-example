[defaults]
roles_path = ansible/roles
host_key_checking = False
retry_files_enabled = False
nocows = 1
# Das Flag '--inventory-file' setzt Vagrants ansible_local-Provisioner selbst,
# nicht dieses Playbook. Wir können den Aufruf nicht ändern, blenden die
# (rein kosmetische) Deprecation-Meldung daher wie von Ansible empfohlen aus.
deprecation_warnings = False
